version: '3.8'

services:
  nsfw-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: yuki_nsfw_engine
    restart: always
    ports:
      - "7860:7860"
    env_file:
      - sample.env
    environment:
      - PORT=7860
      - NSFW_HOST=0.0.0.0
      - NSFW_WORKERS=2
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
