name: Yuki NSFW API CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  code-quality:
    name: Code Quality & Bytecode Validation
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Python Syntax & Bytecode Compilation
        run: |
          python -m py_compile $(find . -name "*.py" -not -path "*/.*")
          echo "All Python source files compiled successfully without syntax errors."

      - name: Validate Shell Script Syntax
        run: |
          bash -n nsfw_start.sh
          echo "Start script syntax is valid."
